spring.application.name=mini-coding-agent
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.options.model=deepseek-chat
spring.profiles.active=local

# Point this at a dedicated sandbox directory, never your real source tree.
agent.workspace=/Users/apple/IdeaProjects/Boot4Boot

# Local-only by default: the agent can write and delete files, so don't expose it.
server.address=127.0.0.1
server.port=8080

# ---- Git (user-driven only; none of this is exposed as a model tool) ----
# The repository the :status/:diff/:check/:commit/:push commands operate on.
# Keep this the source tree; agent.workspace stays the model's scratch sandbox.
agent.git.repo=/Users/apple/IdeaProjects/Boot4Boot

# Commit + push after a verified turn. Off by default: a push is not undoable.
agent.git.auto-push=false

# Force-push is refused unless this is set. Uses --force-with-lease when enabled.
agent.git.allow-force=false

# Only these branches may be pushed. Anything else is refused outright.
agent.git.branch-allowlist=main

# Remote name, and the exact-ref push target.
agent.git.remote=origin

# The gate. Runs before every push; a non-zero exit blocks it.
# Keep the leading "mvn" first: it is executed via ProcessBuilder, not a shell.
agent.git.verify-command=mvn -q -B test
